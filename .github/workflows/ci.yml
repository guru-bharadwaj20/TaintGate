name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,mcp,ui]'
      - run: python -m ruff check .
      - run: python -m ruff format --check taintgate tests
      - run: python -m mypy
      - run: python -m pytest --cov=taintgate --cov-report=term-missing
      - run: python -m build
