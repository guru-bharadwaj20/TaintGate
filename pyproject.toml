[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taintgate"
version = "0.1.0"
description = "Deterministic information-flow enforcement for LLM agent plans"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "guru-bharadwaj20", email = "gururb20@gmail.com"}]
dependencies = ["pydantic>=2.10,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<7", "hypothesis>=6.130,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2", "types-jsonschema", "httpx>=0.28,<1"]
mcp = ["mcp==1.28.0", "rfc8785>=0.1.4,<1", "markdown-it-py>=3,<5"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
models = ["llama-cpp-python==0.3.36"]
bench = ["agentdojo @ git+https://github.com/ethz-spylab/agentdojo.git@089ed468cf3ed0322acc66b0211f26d9d90dbf60"]
demo-video = ["pillow>=12,<13", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
taintgate = "taintgate.cli:main"

[tool.setuptools.packages.find]
include = ["taintgate*"]

[tool.setuptools.package-data]
taintgate = ["py.typed", "ui/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["taintgate"]

[[tool.mypy.overrides]]
module = ["llama_cpp.*", "markdown_it.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["model: requires an explicitly configured local model", "integration: component integration"]

[tool.coverage.run]
source = ["taintgate"]
branch = true

[tool.coverage.report]
show_missing = true
