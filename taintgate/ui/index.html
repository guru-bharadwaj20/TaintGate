<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaintGate dry-run</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#101a23;color:#e6edf4}input,textarea,button{font:inherit;padding:.6rem;border-radius:6px}textarea{display:block;width:95%;min-height:9rem}section{border:1px solid #425263;margin:1rem 0;padding:1rem;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.deny{color:#ff8989}.allow{color:#89e0ae}svg{width:100%;height:300px}</style>
<h1>TaintGate</h1><p>Isolated dry-run tools. Every allowed call passes deterministic checks.</p>
<label>Local session token <input id="token" type="password" autocomplete="off"></label>
<label for="plan">Plan</label><textarea id="plan">mail = email__read()
email__send(to=mail.recipient, body=mail.body)</textarea>
<button id="run">Run plan</button><p id="status" role="status"></p>
<section><h2>Run timeline</h2><ol id="timeline"></ol></section>
<section><h2>Provenance</h2><svg id="graph" role="img" aria-label="Execution provenance graph"></svg></section>
<script>
const el=id=>document.getElementById(id);
let latest;
async function api(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+el('token').value},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.detail||'Request rejected');return data;}
function timeline(data){el('timeline').replaceChildren();for(const event of data.decisions){const item=document.createElement('li');item.textContent=event.tool+': '+event.action;item.className=event.action;el('timeline').append(item);}}
el('run').onclick=async()=>{try{latest=await api('/runs',{source:el('plan').value});el('status').textContent=latest.status;timeline(latest);if(window.renderDetails)window.renderDetails(latest);}catch(error){el('status').textContent=error.message;}};
function graph(data){const svg=el('graph');svg.replaceChildren();const ns='http://www.w3.org/2000/svg';const nodes=data.trace;svg.setAttribute('viewBox','0 0 900 '+Math.max(300,nodes.length*55));const positions=new Map(nodes.map((n,i)=>[n.operation||String(i),[160+(i%3)*280,35+i*55]]));for(const [i,n] of nodes.entries()){const pos=positions.get(n.operation||String(i));for(const parent of n.parents||[]){if(!positions.has(parent))continue;const p=positions.get(parent);const line=document.createElementNS(ns,'line');for(const [k,v]of Object.entries({x1:p[0],y1:p[1],x2:pos[0],y2:pos[1],stroke:'#89a7bf'}))line.setAttribute(k,v);svg.append(line);}const circle=document.createElementNS(ns,'circle');circle.setAttribute('cx',pos[0]);circle.setAttribute('cy',pos[1]);circle.setAttribute('r','12');circle.setAttribute('fill',n.integrity==='UNTRUSTED'?'#d77e67':'#69ad86');svg.append(circle);const text=document.createElementNS(ns,'text');text.setAttribute('x',pos[0]+18);text.setAttribute('y',pos[1]+5);text.setAttribute('fill','#e6edf4');text.textContent='Step '+i+' '+(n.integrity||'');svg.append(text);}}
window.renderDetails=graph;
</script></html>
